<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Srijan Gupta — AI/ML Engineer building machine learning systems and interfaces." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://www.srijan.website/" />

    <!-- Share tags. These have to be static and present in the served HTML:
         most crawlers and chat apps do not run the app, so anything set from
         JS is invisible to them. Per-route titles and descriptions are
         applied at runtime by useDocumentMeta and are therefore best-effort
         for share previews; the values below are the guaranteed fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Srijan Gupta" />
    <meta property="og:title" content="Srijan Gupta — AI/ML Engineer" />
    <meta property="og:description" content="Srijan Gupta — AI/ML Engineer building machine learning systems and interfaces." />
    <meta property="og:url" content="https://www.srijan.website/" />
    <meta property="og:image" content="https://www.srijan.website/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Srijan Gupta — AI/ML Engineer" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Srijan Gupta — AI/ML Engineer" />
    <meta name="twitter:description" content="Srijan Gupta — AI/ML Engineer building machine learning systems and interfaces." />
    <meta name="twitter:image" content="https://www.srijan.website/og-image.png" />
    <meta name="twitter:image:alt" content="Srijan Gupta — AI/ML Engineer" />

    <!-- Same person, for search engines: name, role, where to find me. The
         profile URLs are the same ones the footer links to. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Srijan Gupta",
        "jobTitle": "AI/ML Engineer",
        "url": "https://www.srijan.website/",
        "image": "https://www.srijan.website/og-image.png",
        "sameAs": [
          "https://github.com/JellyFishJuggler",
          "https://www.linkedin.com/in/srijang"
        ]
      }
    </script>

    <!-- Inline so there is no extra request, and no 404 for a favicon.ico the
         project doesn't ship: a white dot on black, the same mark the theme
         toggle rests at rest. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Srijan Gupta — AI/ML Engineer</title>
    <script>
      /* Apply the stored theme before first paint, so a light-theme reload
         never flashes the dark palette. Wrapped in try/catch because
         localStorage throws in private/blocked contexts. */
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {
        /* storage unavailable; the app defaults to dark */
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
